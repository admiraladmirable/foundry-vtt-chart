apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foundry-vtt.fullname" . }}
  labels:
    {{- include "foundry-vtt.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "foundry-vtt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "foundry-vtt.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "foundry-vtt.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: {{ .Chart.Name }}-module-fetcher
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
          - >-
            {{- if .Values.moduleFetcher.enabled }}
            echo "Fetching modules..." &&
            mkdir -p /data/modules &&
            {{- range $name, $url := .Values.moduleFetcher.modules }}
            echo "Downloading {{$name}} from {{$url}}" &&
            curl -fsSL "{{ $url }}" -o "/data/modules/{{$name}}" &&
            {{- end }}
            echo "All modules downloaded."
            {{- else }}
            echo "Module fetcher disabled.";
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: "/data"
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: FOUNDRY_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secretName }}
                key: username
          - name: FOUNDRY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secretName }}
                key: password
          - name: CONTAINER_PRESERVE_CONFIG
            value: {{ .Values.options.preserveConfig | quote }}
          - name: UV_THREADPOOL_SIZE
            value: {{ .Values.options.threadCount | quote }}
          - name: FOUNDRY_MINIFY_STATIC_FILES
            value: "true"
          - name: FOUNDRY_TELEMETRY
            value: "false"
          - name: FOUNDRY_IP_DISCOVERY
            value: {{ .Values.options.ipDiscovery | quote }}
          - name: CONTAINER_VERBOSE
            value: {{ .Values.options.verboseLogging | quote }}
          {{- if .Values.options.gid }}
          - name: FOUNDRY_GID
            value: {{ .Values.options.gid | quote }}
          {{- end }}
          {{- if .Values.options.hostname }}
          - name: FOUNDRY_HOSTNAME
            value: {{ .Values.options.hostname | quote }}
          {{- end }}
          {{- if .Values.options.proxySSL }}
          - name: FOUNDRY_PROXY_SSL
            value: {{ .Values.options.proxySSL | quote }}
          {{- end }}
          {{- if .Values.options.proxyPort }}
          - name: FOUNDRY_PROXY_PORT
            value: {{ .Values.options.proxyPort | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: "/data"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "foundry-vtt.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
